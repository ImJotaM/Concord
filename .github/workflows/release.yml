name: 'Release Concord Desktop'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Build server, frontend and bundle resources
        run: |
          npm --prefix server run build
          npm run build
          node scripts/prepare-tauri-resources.cjs

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Concord LAN App v__VERSION__'
          releaseBody: 'Concord LAN v__VERSION__ - Aplicativo de bate-papo em rede local com voz WebRTC, compartilhamento de tela, mensagens diretas (DMs) e soundboard. Baixe o instalador .exe abaixo.'
          releaseDraft: false
          prerelease: false
